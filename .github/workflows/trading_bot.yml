name: Scheduled Trading Bot Updates

on:
  schedule:
    # 05:03 UTC = 10:33 AM IST (Monday to Friday) - Morning Check
    - cron: '3 5 * * 1-5'

    # 10:17 UTC = 03:47 PM IST (Monday to Friday) - Post-Market Holdings Update
    - cron: '17 10 * * 1-5'
  workflow_dispatch:
    inputs:
      bot_to_run:
        description: 'Choose which bot to run manually'
        required: true
        default: 'both'
        type: choice
        options:
          - dhan
          - zerodha
          - both

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Dhan Bot
        if: "${{ github.event_name == 'schedule' || inputs.bot_to_run == 'dhan' || inputs.bot_to_run == 'both' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          SCREENER_URL: ${{ secrets.SCREENER_URL }}
        run: |
          uv run DhanBot.py

      - name: Run Zerodha Bot
        if: "${{ github.event_name == 'schedule' || inputs.bot_to_run == 'zerodha' || inputs.bot_to_run == 'both' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
        run: |
          uv run ZerodhaBot.py
