[project]
name = "dhankiteauto"
version = "0.1.0"
description = "Automated trading bots for Dhan and Zerodha Kite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "dhanhq>=2.2.0",
    "kiteconnect>=5.2.2",
    "pyotp>=2.10.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
